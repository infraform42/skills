# Feste deutsche Werte, die nach jeder Übersetzung gesetzt werden (Pfad → Feld → Wert).
# source_sha256 = englische Quelle (main) beim Anlegen; weicht sie ab, meldet i18n.py einen HINWEIS.
# Pflege: python tools/override_add.py <pfad/SKILL.md> …
skills/engineering/domain-modeling/SKILL.md:
  description: Baut und schärft das Domänenmodell eines Projekts. Verwenden, wenn Codebase-Terminologie diskutiert wird, eine CONTEXT.md geschrieben oder bearbeitet wird, oder ein ADR festgehalten oder bearbeitet wird. „lass uns die Begriffe im Domänenmodell schärfen“, „schreib das in die CONTEXT.md“, „halt das als ADR fest“, „leg die Fachbegriffe für dieses Projekt fest“, „ist unser Glossar noch aktuell“
  source_sha256: 327a2b50620e2fd70abc6893cd6965e76b20f8d0adb0dc2c8d5eb3845efb643e
skills/engineering/tdd/SKILL.md:
  description: Testgetriebene Entwicklung. Verwenden, wenn der Nutzer Features test-first entwickeln oder Bugs test-first beheben möchte, „red-green-refactor“ erwähnt oder Integrationstests wünscht. „lass uns das test-first entwickeln“, „schreib erst den Test, dann den Code“, „fang mit einem roten Test an“, „TDD für dieses Feature“, „red-green-refactor für den Bugfix“
  source_sha256: cb01f66bebfaa25fa1f88e6b7e769cd9fd9f35b1120b8563749820738814c927
skills/engineering/to-spec/SKILL.md:
  description: 'Verwandelt die aktuelle Konversation in eine Spec und veröffentlicht sie im Projekt-Issue-Tracker: kein Interview, sondern reine Synthese des bereits Besprochenen. Verwenden, wenn der Nutzer eine bestehende Diskussion in eine formale Spec überführen und ins Ticketsystem übertragen möchte.'
  source_sha256: 43ad9cf318e5e7d3d1fa360253a37021796dc87a0c2e595ad262661a10f85088
skills/engineering/to-tickets/SKILL.md:
  description: Zerlegt einen Plan, eine Spec oder die aktuelle Konversation in eine Reihe von Tracer-Bullet-Tickets, wobei jedes seine blockierenden Kanten deklariert, und veröffentlicht sie im konfigurierten Tracker (Kanten als Text in je einer Datei pro Ticket lokal, oder native Blocking-Links auf einem echten Tracker).
  source_sha256: 5c9fba69845c2519b9b35b9af42ae5142c21f8ca15ac2123dc2722002c8058ae
skills/productivity/grilling/SKILL.md:
  description: Fragemethode für Pläne, Entwürfe und Entscheidungen – Entscheidungsbaum, Frontier, Fragerunden mit empfohlenen Antworten. Baustein, den andere Skills per Namen aufrufen.
  source_sha256: 10ff989e7498b23b5acb49d5048f11dcd906757d2f79c5cdf8a00001381296f2
